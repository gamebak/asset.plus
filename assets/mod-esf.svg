<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" role="img" aria-label="Illustration: a charged energy blast over a rocky skyline">
  <defs>
    <radialGradient id="bg" cx="0.62" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#2c2470"/>
      <stop offset="1" stop-color="#0b0a1f"/>
    </radialGradient>
    <radialGradient id="ball" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#d6f6ff"/>
      <stop offset="0.6" stop-color="#5cc8ff"/>
      <stop offset="1" stop-color="#2a6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.3" stop-color="#fff3a0" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffcc33" stop-opacity="0.25"/>
    </radialGradient>
  </defs>
  <rect width="160" height="100" fill="url(#bg)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="14" cy="12" r="0.9"/><circle cx="38" cy="26" r="0.7"/><circle cx="58" cy="9" r="1"/>
    <circle cx="140" cy="14" r="0.8"/><circle cx="150" cy="38" r="0.6"/><circle cx="24" cy="44" r="0.6"/>
  </g>
  <!-- speed lines -->
  <g stroke="#9fdcff" stroke-linecap="round" opacity="0.55">
    <path d="M6 40h44" stroke-width="1.4"/>
    <path d="M16 50h52" stroke-width="2"/>
    <path d="M4 60h46" stroke-width="1.2"/>
    <path d="M26 45h30" stroke-width="0.8"/>
    <path d="M22 56h36" stroke-width="0.8"/>
  </g>
  <!-- aura spikes -->
  <polygon fill="url(#aura)" points="100,8 106,32 124,16 116,38 142,34 120,48 146,58 118,58 132,80 110,64 104,90 96,66 80,84 88,60 62,62 84,48 64,32 88,38 82,14 96,32"/>
  <!-- energy ball -->
  <circle cx="100" cy="50" r="30" fill="url(#ball)"/>
  <circle cx="100" cy="50" r="11" fill="#fff"/>
  <!-- rocky skyline -->
  <path fill="#1a1540" d="M0 100V82l14-8 10 6 16-14 12 10 18-6 14 12 20-10 16 8 14-12 14 8 12-4v28z"/>
  <path fill="#120f2e" d="M0 100V92l20-4 24 6 30-6 26 5 30-7 30 6v8z"/>
</svg>
